<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />

  <!-- Subtle Decorative Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Glow circles in background -->
  <circle cx="640" cy="340" r="180" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="220" r="140" fill="#8b5cf6" fill-opacity="0.10" filter="url(#glow)" />

  <!-- Main Container Card -->
  <rect x="100" y="70" width="1080" height="580" rx="24" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />

  <!-- Top Pill / Badge -->
  <g transform="translate(140, 115)">
    <rect width="360" height="38" rx="19" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="35" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="1">FULL WALKTHROUGH DEMO • 10:42</text>
  </g>

  <!-- Project Title -->
  <text x="140" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    TOGETHER
  </text>
  <text x="440" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
    AI Group &amp; Solo Commerce Agent
  </text>

  <!-- Subtitle / Tagline -->
  <text x="140" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    End-to-end agentic discovery, dynamic catalog ranking, group consensus, &amp; Razorpay payment flow.
  </text>

  <!-- Center Play Button with Rings -->
  <g transform="translate(640, 390)">
    <!-- Outer Ripple Ring -->
    <circle cx="0" cy="0" r="85" fill="#3b82f6" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="72" fill="#2563eb" fill-opacity="0.25" />
    <!-- Main Play Circle -->
    <circle cx="0" cy="0" r="58" fill="url(#playGrad)" stroke="#60a5fa" stroke-width="3" filter="url(#glow)" />
    <!-- Triangle Icon -->
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff" />
  </g>

  <!-- Action CTA Text under Play Button -->
  <text x="640" y="495" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Click to Watch the Full Walkthrough Demo
  </text>
  <text x="640" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Razorpay Buildathon • Test Mode Verified • PostgreSQL Neon Cloud
  </text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(140, 580)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="105" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">✦ Natural Language Matching</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(225, 0)">
      <rect width="230" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="115" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">✦ Side-by-Side Comparison</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect width="235" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="117" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">✦ Group Shopping Consensus</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(720, 0)">
      <rect width="280" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="140" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">✦ Razorpay Test Mode Verification</text>
    </g>
  </g>
</svg>
